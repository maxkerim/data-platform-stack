# Пример для нескольких ВМ. Скопируйте в hosts.ini и подставьте свои адреса:
#   cp inventory/hosts.example.ini inventory/hosts.ini
#   ansible-playbook -i inventory/hosts.ini site.yml --ask-vault-pass
#
# При разнесении по разным ВМ в group_vars задайте адрес БД DWH и включите её публикацию:
#   dwh_db_host: dwh-vm.example.local
#   dwh_db_publish_address: "0.0.0.0"
# а доступ к порту 5432 ограничьте файрволом только для ВМ Airflow и Superset.

[dwh]
dwh-vm.example.local ansible_user=deploy

[airflow]
airflow-vm.example.local ansible_user=deploy

[superset]
superset-vm.example.local ansible_user=deploy

[proxy]
proxy-vm.example.local ansible_user=deploy

[data_platform:children]
dwh
airflow
superset
proxy
