name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Initialize and validate local Docker module
        run: |
          terraform -chdir=docker init -backend=false -input=false -lockfile=readonly
          terraform -chdir=docker validate
      - name: Apply, smoke test, and destroy local Docker module
        run: |
          cd docker
          trap 'terraform destroy -auto-approve -input=false' EXIT
          terraform apply -auto-approve -input=false
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:18089/

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ansible ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Lint and syntax check
        working-directory: ansible
        run: |
          cp group_vars/all/vault.yml.example group_vars/all/vault.yml
          ansible-lint site.yml
          ansible-playbook -i inventory/local.ini site.yml --syntax-check

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: stand
        run: docker compose --env-file .env.example config --quiet